###############################################################################
# General

# tmux show-options -g | grep status

# address vim mode switching delay
set -s escape-time 0

# increase scrollback buffer size
set -g history-limit 100000

# tmux messages are displayed for 5 seconds
set -g display-time 5000

# windows and panels start at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

set -g renumber-windows on
set -g allow-rename off
set -g set-titles on

# default tmux terminal
# set -s default-terminal "screen-256color"
# use kitty as terminal
# set -s default-terminal "xterm-kitty"
set -s default-terminal "xterm-256color"

# https://github.com/navarasu/onedark.nvim/issues/112#issuecomment-1281022184
set -ga terminal-overrides ",xterm-256color:Tc"

set -g status-keys vi
setw -g mode-keys vi

set -g mouse on

# silence
set -g visual-activity off
set -g visual-bell off
set -g visual-silence on
setw -g monitor-activity off
set -g bell-action none

# focus events enabled for terminals that support them (vim)
set -g focus-events on

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Sane window splitting inspired from tmux pain-control, similar to vim
# vertical split (left/right)
bind-key "\\" split-window -h -c "#{pane_current_path}"
bind-key | split-window -fh -c "#{pane_current_path}"
bind-key v split-window -fh -c "#{pane_current_path}"

# horizontal split (top/bottom)
bind-key "\'" split-window -v -c "#{pane_current_path}"
bind-key "\"" split-window -fv -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -fv -c "#{pane_current_path}"
bind-key h split-window -fv -c "#{pane_current_path}"


# swap windows
bind-key -r < swap-window -t -1
bind-key -r > swap-window -t +1

# resize window
bind-key -r H resize-pane -L 10
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 10

# vim/fzf tmux integration
# https://github.com/christoomey/vim-tmux-navigator/issues/295#issuecomment-1021591011
is_vim_or_fzf="children=(); i=0; pids=( $(ps -o pid= -t '#{pane_tty}') ); \
while read -r c p; do [[ -n c && c -ne p && p -ne 0 ]] && children[p]+=\" $\{c\}\"; done <<< \"$(ps -Ao pid=,ppid=)\"; \
while (( $\{#pids[@]\} > i )); do pid=$\{pids[i++]\}; pids+=( $\{children[pid]-\} ); done; \
ps -o state=,comm= -p \"$\{pids[@]\}\" | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"

bind -n C-h run "($is_vim_or_fzf && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim_or_fzf && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim_or_fzf && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "($is_vim_or_fzf && tmux send-keys C-l) || tmux select-pane -R"

# allow using shift+enter on claude code
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# easier and faster switching between next/prev window/session
bind p previous-window
bind n next-window
bind P switch-client -p
bind N switch-client -n

# use k to kill pane and K to kill window X will kill session because of tmux-sessionist
bind-key k kill-pane
bind-key K unlink-window -k

# use r/R to rename window and session respectively
bind-key r command-prompt 'rename-window %%'
bind-key R command-prompt 'rename-session %%'

bind-key Enter copy-mode
bind-key [ copy-mode
bind-key ] copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

# clear screen
bind-key S send-keys -R \; clear-history

# Easy config reload
bind-key M-r run-shell 'tmux source-file ~/.tmux.conf > /dev/null; tmux display-message "tmux.conf sourced."'

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# support for both osx and linux due to the reattach-to-user-namespace os x fix
# taken from http://www.economyofeffort.com/2013/07/29/reattach-to-user-namespace-the-fix-for-your-tmux-in-os-x-woes/
# (see comments)
if-shell "type 'reattach-to-user-namespace' >/dev/null" "set -g default-command 'reattach-to-user-namespace -l $SHELL'"

###############################################################################
# Theme

# references
# https://github.com/tmux/tmux/wiki/Getting-Started#colours-and-styles
# https://github.com/tmux/tmux/wiki/Getting-Started#list-of-style-and-format-options
# https://github.com/tmux/tmux/wiki/Formats
# tmux show-options -g | grep status

# current theme: astrodark

# variables to configure statusline
# PRIMARY = block colours (text on background)
# SECONDARY = powerline arrow leaving a block
%hidden COLOR_BAR="#1A1D23"
%hidden COLOR_ACCENT="#50A4E9"
%hidden COLOR_ACCENT_TEXT="#1A1D23"
%hidden COLOR_SEGMENT="#26343F"
%hidden COLOR_INACTIVE="#494D56"
%hidden PROMPT_FILL="#D09214"

%hidden RESET="nobold,nounderscore,noitalics"

%hidden ACTIVE_PRIMARY="#[fg=#{COLOR_ACCENT_TEXT},bg=#{COLOR_ACCENT},bold]"
%hidden ACTIVE_SECONDARY="#[fg=#{COLOR_ACCENT},bg=#{COLOR_BAR},#{RESET}]"

%hidden SEGMENT_START="#[fg=#{COLOR_BAR},bg=#{COLOR_SEGMENT},#{RESET}]"
%hidden SEGMENT_PRIMARY="#[fg=#{COLOR_ACCENT},bg=#{COLOR_SEGMENT}]"
%hidden SEGMENT_SECONDARY="#[fg=#{COLOR_SEGMENT},bg=#{COLOR_BAR},#{RESET}]"

%hidden INACTIVE_PRIMARY="#[fg=#{COLOR_ACCENT},bg=#{COLOR_BAR}]"
%hidden INACTIVE_SECONDARY="#[fg=#{COLOR_BAR},bg=#{COLOR_BAR},#{RESET}]"

%hidden PROMPT_PRIMARY="#[fg=#{COLOR_BAR},bg=#{PROMPT_FILL}]"
%hidden PROMPT_SECONDARY="#[fg=#{PROMPT_FILL},bg=#{COLOR_BAR}]"

%hidden BATTERY_GREEN="#87C05F"
%hidden BATTERY_GREEN_DARK="#75AD47"
%hidden BATTERY_YELLOW="#DFAB25"
%hidden BATTERY_YELLOW_DARK="#D09214"
%hidden BATTERY_ORANGE="#F5983A"
%hidden BATTERY_ORANGE_DARK="#EB8332"
%hidden BATTERY_RED="#FF838B"
%hidden BATTERY_RED_DARK="#F8747E"
%hidden BATTERY_BLUE="#50A4E9"
%hidden BATTERY_GREY="#9B9FA9"

# Set status bar on
set -g status on
# Update the status line every second
set -g status-interval 1
# Set the position of window lists.
set -g status-justify left
# Set the status bar position
set -g status-position bottom
# Set status bar background and foreground color.
set -g status-style fg="#{COLOR_ACCENT}",bg="#{COLOR_BAR}"

# status-left
set -g status-left "#{E:ACTIVE_PRIMARY} #S #{E:ACTIVE_SECONDARY}"
set -g status-left-length 100
set -g status-left-style NONE

# status-right
set -g status-right "#{E:INACTIVE_SECONDARY}#{E:INACTIVE_PRIMARY} #{tmux_mode_indicator} #{E:SEGMENT_SECONDARY}#{E:SEGMENT_PRIMARY} #{battery_icon_status} #{battery_color_charge_fg}#[bg=#{COLOR_SEGMENT}]#{battery_percentage} #{battery_remain} #{E:SEGMENT_PRIMARY} %A %d/%m %H:%M #{E:SEGMENT_PRIMARY}#{E:ACTIVE_PRIMARY} #h "
set -g status-right-length 100
set -g status-right-style NONE

# window related styles (shown by status-justify)
set -g window-status-current-format "#{E:SEGMENT_START}#{E:SEGMENT_PRIMARY}#[bold] #I  #W #F #{E:SEGMENT_SECONDARY}"
set -g window-status-format "#{E:INACTIVE_SECONDARY}#[default] #I  #W #F #{E:INACTIVE_SECONDARY}"
set -g window-status-style NONE,fg="#{COLOR_INACTIVE}",bg="#{COLOR_BAR}"
set -g window-status-activity-style underscore,fg="#{COLOR_INACTIVE}",bg="#{COLOR_BAR}"
set -g window-status-separator ""

# other styles
set -g message-style fg="#{COLOR_ACCENT}",bg="#{COLOR_SEGMENT}"
set -g message-command-style fg="#{COLOR_ACCENT}",bg="#{COLOR_SEGMENT}"
set -g mode-style fg="#{COLOR_ACCENT}",bg="#{COLOR_SEGMENT}"
set -g pane-active-border-style fg="#{COLOR_ACCENT}"
set -g pane-border-style fg="#{COLOR_SEGMENT}"

###############################################################################
# Plugins

set -g @plugin 'tmux-plugins/tpm'
# Tmux Plugin Manager
# To install plugins: Prefix + I
# To update plugins: Prefix + U
# To uninstall plugins (after removing from config): Prefix + alt + u
# scripts @ "~/.tmux/plugins/tpm/bin/clean_plugins"


set -g @plugin 'tmux-plugins/tmux-copycat'
# Search with Prefix + / like in vim (use n N to navigate between results, Enter to copy result)


set -g @plugin 'tmux-plugins/tmux-yank'
# makes paste work properly using custom OS dependent clipboard.
# Each OS needs different external copy/paste handler plugin.
# See github documento for more info
# for macOSX this option is needed along with brew install reattach-to-user-namespace
set -g default-command "reattach-to-user-namespace -l zsh"


set -g @plugin 'tmux-plugins/tmux-resurrect'
# persists tmux session
# Prefix + Ctrl-s to save
# Prefix + Ctrl-r to restore
# sessions files stored in ~/.tmux/resurrect


set -g @plugin 'tmux-plugins/tmux-continuum'
# continuous saving of tmux sessions (built on top of tmux-resurrect)
# Do not call tmux automatically on system start-up
set -g @continuum-boot 'off'
# automatic restore tmux session
set -g @continuum-restore 'on'


set -g @plugin 'tmux-plugins/tmux-sessionist'
# easy tmux session management
# prefix + g - prompts for session name and switches to it. Performs 'kind-of' name completion.
# Faster than the built-in prefix + s prompt for long session lists.
# prefix + C (shift + c) - prompt for creating a new session by name.
# prefix + X (shift + x) - kill current session without detaching tmux.
# prefix + g (shift + g) - switch to previous session
set -g @sessionist-alternate 'S'
set -g @sessionist-goto 'g'
set -g @sessionist-new 'C'
set -g @sessionist-kill-session 'X'
set -g @sessionist-join-pkne 't'
set -g @sessionist-promote-pane 'T'


set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# better mouse integration with tmux. check below options if behavior if weird
# look at the github repo for more info
set -g @scroll-down-exit-copy-mode "off" # default on
set -g @scroll-without-changing-pane "on" # default off
set -g @scroll-in-moused-over-pane "on" # default on
set -g @scroll-speed-num-lines-per-scroll "3" # default 3
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on" # default off

set -g @plugin 'fcsonline/tmux-thumbs'
# defaults taken from https://github.com/fcsonline/tmux-thumbs
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'
set -g @thumbs-contrast 1

set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'o'
set -g @fzf-url-history-limit '100000'


## Statusline related plugins
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @mode_indicator_prefix_prompt "#{E:PROMPT_SECONDARY}#{E:PROMPT_PRIMARY} Prefix "
set -g @mode_indicator_copy_prompt "#{E:PROMPT_SECONDARY}#{E:PROMPT_PRIMARY} Copy "
set -g @mode_indicator_sync_prompt '​'
set -g @mode_indicator_empty_prompt '​'
set -g @mode_indicator_prefix_mode_style ''


set -g @plugin 'tmux-plugins/tmux-battery'
# Allows putting battery icons and notifications on the status-bar
set -g @batt_remain_short true

set -g @batt_color_charge_primary_tier8 "$BATTERY_GREEN"
set -g @batt_color_charge_primary_tier7 "$BATTERY_GREEN_DARK"
set -g @batt_color_charge_primary_tier6 "$BATTERY_YELLOW"
set -g @batt_color_charge_primary_tier5 "$BATTERY_YELLOW_DARK"
set -g @batt_color_charge_primary_tier4 "$BATTERY_ORANGE"
set -g @batt_color_charge_primary_tier3 "$BATTERY_ORANGE_DARK"
set -g @batt_color_charge_primary_tier2 "$BATTERY_RED"
set -g @batt_color_charge_primary_tier1 "$BATTERY_RED_DARK"
set -g @batt_color_status_primary_charged "$BATTERY_GREEN"
set -g @batt_color_status_primary_charging "$BATTERY_GREEN"
set -g @batt_color_status_primary_discharging "$BATTERY_YELLOW"
set -g @batt_color_status_primary_attached "$BATTERY_BLUE"
set -g @batt_color_status_primary_unknown "$BATTERY_GREY"

set -g @plugin 'xamut/tmux-weather'
set -g @tmux-weather-interval 5
set -g @tmux-weather-format "%c+%t+%h+%p+%w"

###############################################################################
# TPM Bootstrap

# Auto Install TMUX plugin manager if it doesn't exist
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
