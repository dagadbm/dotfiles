; fast-syntax-highlighting astrodark theme
; colors mapped from ~/.local/share/nvim-astrovim/lazy/astrotheme/extras/fish/astrodark.fish (closest extra to zsh)
; palette: ~/.local/share/nvim-astrovim/lazy/astrotheme/lua/astrotheme/palettes/astrodark.lua
; fish_color_normal       #ADB0BB  syntax.text
; fish_color_command      #4AC2B8  syntax.cyan    commands, builtins, functions, aliases
; fish_color_keyword      #DD97F1  syntax.purple  reserved words (fish "pink")
; fish_color_quote        #DFAB25  syntax.yellow  quoted strings
; fish_color_redirection  #ADB0BB  syntax.text    > >> <<< 2>&1
; fish_color_end          #F5983A  syntax.orange  ; && || | & separators
; fish_color_error        #FF838B  syntax.red     unknown tokens
; astrodark theme, derived
; legend: <palette key>: <roles>
; syntax.cyan: commands, builtins, functions, aliases (incl. suffix/global), precommands, hashed commands, single-sq-bracket
; syntax.purple: reserved words, subcommands, double-sq-bracket, double-paren, options, back-dollar-quoted, case parentheses
; syntax.yellow: single/double/dollar quoted arguments
; syntax.orange: command separator, for-loop separator
; syntax.green: variables, globbing, bracket levels 1-3, here-string var, subtle separator, $ in double quotes, assign array bracket, history expansion, mathvar, forvar, for operator, case input
; syntax.text: redirection, here-string tri, exec descriptor
; syntax.red: unknown token, incorrect-subtle, math error
; syntax.comment: comments
; ui.selection: here-string text/var bg, subtle bg, paired-bracket bg
[base]
default          = none
unknown-token    = #FF838B
commandseparator = #F5983A
redirection      = #ADB0BB
here-string-tri  = #ADB0BB
here-string-text = bg:#26343F
here-string-var  = #87C05F,bg:#26343F
exec-descriptor  = #ADB0BB
comment          = #696C76
correct-subtle   = none
incorrect-subtle = #FF838B
subtle-separator = #87C05F
subtle-bg        = bg:#26343F
secondary        =
recursive-base   =

[command-point]
reserved-word     = #DD97F1
subcommand        = #DD97F1
alias             = #4AC2B8
suffix-alias      = #4AC2B8
global-alias      = #4AC2B8
builtin           = #4AC2B8
function          = #4AC2B8
command           = #4AC2B8
precommand        = #4AC2B8
hashed-command    = #4AC2B8
single-sq-bracket = #4AC2B8
double-sq-bracket = #DD97F1
double-paren      = #DD97F1

[paths]
path          = underline
pathseparator =
path-to-dir   = underline
globbing      = #87C05F
globbing-ext  = #87C05F

[brackets]
paired-bracket  = bg:#26343F
bracket-level-1 = #87C05F
bracket-level-2 = #87C05F
bracket-level-3 = #87C05F

[arguments]
single-hyphen-option   = #DD97F1
double-hyphen-option   = #DD97F1
back-quoted-argument   = none
single-quoted-argument = #DFAB25
double-quoted-argument = #DFAB25
dollar-quoted-argument = #DFAB25
optarg-string          = none
optarg-number          = none

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #DD97F1
; backslash or $... in "..." (fish colors "$var" as operator)
back-or-dollar-double-quoted-argument = #87C05F

[other]
variable             = #87C05F
assign               = none
assign-array-bracket = #87C05F
history-expansion    = #87C05F

[math]
mathvar = #87C05F
mathnum = none
matherr = #FF838B

[for-loop]
forvar  = #87C05F
fornum  = none
foroper = #87C05F
forsep  = #F5983A

[case]
case-input       = #87C05F
case-parentheses = #DD97F1
case-condition   = none
