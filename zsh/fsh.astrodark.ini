; astrodark theme, derived
; legend: <palette key>: <variables set>
; syntax.red: base.unknown-token, base.incorrect-subtle, math.matherr
; syntax.orange: base.commandseparator, for-loop.forsep
; syntax.text: base.redirection, base.here-string-tri, base.exec-descriptor
; ui.selection: base.here-string-text bg, base.here-string-var bg, base.subtle-bg bg, brackets.paired-bracket bg
; syntax.green: base.here-string-var, base.subtle-separator, paths.globbing, paths.globbing-ext, brackets.bracket-level-1, brackets.bracket-level-2, brackets.bracket-level-3, in-string.back-or-dollar-double-quoted-argument, other.variable, other.assign-array-bracket, other.history-expansion, math.mathvar, for-loop.forvar, for-loop.foroper, case.case-input
; syntax.comment: base.comment
; syntax.purple: command-point.reserved-word, command-point.subcommand, command-point.double-sq-bracket, command-point.double-paren, arguments.single-hyphen-option, arguments.double-hyphen-option, in-string.back-dollar-quoted-argument, case.case-parentheses
; syntax.cyan: command-point.alias, command-point.suffix-alias, command-point.global-alias, command-point.builtin, command-point.function, command-point.command, command-point.precommand, command-point.hashed-command, command-point.single-sq-bracket
; syntax.yellow: arguments.single-quoted-argument, arguments.double-quoted-argument, arguments.dollar-quoted-argument
[base]
default          = none
unknown-token    = #FF838B
commandseparator = #F5983A
redirection      = #ADB0BB
here-string-tri  = #ADB0BB
here-string-text = bg:#26343F
here-string-var  = #87C05F,bg:#26343F
exec-descriptor  = #ADB0BB
comment          = #696C76
correct-subtle   = none
incorrect-subtle = #FF838B
subtle-separator = #87C05F
subtle-bg        = bg:#26343F
secondary        =
recursive-base   =

[command-point]
reserved-word     = #DD97F1
subcommand        = #DD97F1
alias             = #4AC2B8
suffix-alias      = #4AC2B8
global-alias      = #4AC2B8
builtin           = #4AC2B8
function          = #4AC2B8
command           = #4AC2B8
precommand        = #4AC2B8
hashed-command    = #4AC2B8
single-sq-bracket = #4AC2B8
double-sq-bracket = #DD97F1
double-paren      = #DD97F1

[paths]
path          = underline
pathseparator =
path-to-dir   = underline
globbing      = #87C05F
globbing-ext  = #87C05F

[brackets]
paired-bracket  = bg:#26343F
bracket-level-1 = #87C05F
bracket-level-2 = #87C05F
bracket-level-3 = #87C05F

[arguments]
single-hyphen-option   = #DD97F1
double-hyphen-option   = #DD97F1
back-quoted-argument   = none
single-quoted-argument = #DFAB25
double-quoted-argument = #DFAB25
dollar-quoted-argument = #DFAB25
optarg-string          = none
optarg-number          = none

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #DD97F1
; backslash or $... in "..." (fish colors "$var" as operator)
back-or-dollar-double-quoted-argument = #87C05F

[other]
variable             = #87C05F
assign               = none
assign-array-bracket = #87C05F
history-expansion    = #87C05F

[math]
mathvar = #87C05F
mathnum = none
matherr = #FF838B

[for-loop]
forvar  = #87C05F
fornum  = none
foroper = #87C05F
forsep  = #F5983A

[case]
case-input       = #87C05F
case-parentheses = #DD97F1
case-condition   = none
