# nvim as editor. `external` runs a program directly without a shell.
[[verbs]]
invocation = "edit"
shortcut = "e"
keys = ["enter", "ctrl-e"]
apply_to = "text_file"
external = "nvim +{line} {file:space-separated}"
leave_broot = false

