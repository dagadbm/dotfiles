# nvim as editor. `external` runs a program directly without a shell.
[[verbs]]
invocation = "edit"
shortcut = "e"
keys = ["enter", "ctrl-e"]
apply_to = "text_file"
external = "nvim +{line} {file:space-separated}"
leave_broot = false

# astrodark theme, derived
# legend: <palette key>: <variables set>
# syntax.text: default, parent, input, status_normal, status_ellipsis, preview_title, preview, preview unfocused, diff_added, diff_removed, hex_ascii_graphic, staging_area_title
# syntax.comment: default unfocused, parent unfocused, dates, content_extract, flag_label, input unfocused, scrollbar_thumb unfocused, preview_title unfocused, diff_line_number, staging_area_title unfocused
# ui.border: tree, scrollbar_track, help_table_border, preview_separator
# syntax.blue: directory, directory unfocused, help_headers
# syntax.green: exe, perm_x, content_match, git_insertions, git_status_staged, git_status_new, help_code, hex_ascii_whitespace, good_to_bad_0, good_to_bad_1, good_to_bad_2, good_to_bad_3, good_to_bad_4
# syntax.cyan: link, count, status_code
# syntax.mute: pruning, perm__, git_status_current, git_status_ignored, preview_line_number, hex_null
# syntax.yellow: perm_r, owner, group, git_status_modified, char_match, status_job, good_to_bad_5, good_to_bad_6
# syntax.red: perm_w, git_deletions, git_status_conflicted, git_status_other, file_error, status_error, hex_non_ascii, good_to_bad_9
# ui.current_line: count bg, selected_line unfocused bg, scrollbar_track unfocused, help_code bg, diff_line_number bg
# syntax.orange: sparse, help_bold, hex_ascii_other, good_to_bad_7, good_to_bad_8
# syntax.purple: git_branch, flag_value, status_italic, status_bold, purpose_italic, purpose_bold, help_italic, mode_command_mark bg
# ui.selection: selected_line bg, preview_match bg
# ui.statusline: status_error bg, status_job bg, status_normal bg, status_italic bg, status_bold bg, status_code bg, status_ellipsis bg, mode_command_mark
# ui.accent: scrollbar_thumb
# ui.float: preview_title bg, preview_title unfocused bg, staging_area_title bg, staging_area_title unfocused bg
# delta plus-style (#354632): diff_added bg
# delta minus-style (#53373D): diff_removed bg
# notes: unfocused after /; delta hexes from git/delta.astrodark.gitconfig
