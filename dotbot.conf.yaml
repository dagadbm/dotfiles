- defaults:
    clean:
      force: true
    link:
      create: true
      force: true
      relink: true
- clean:
    "~/":
    "~/.config":
      recursive: true
- create:
    # extra folders cache related actions
    - ~/.cache/nvim-dagadbm/undos
    - ~/.cache/nvim-dagadbm/backups
    - ~/.cache/nvim-dagadbm/swaps
    - ~/.cache/nvim-dagadbm/sessions
    - ~/.cache/nvim-dagadbm/gutentags
- link:
    # shells
    ~/.zshrc: zsh/zshrc.zsh
    ~/zshrc.work.zsh: zsh/zshrc.work.zsh
    ~/.zprofile: zsh/zprofile.zsh
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.config/shell/p10k.mise.zsh: zsh/p10k.mise.zsh
    ~/.config/shell/p10k.astrodark.zsh: zsh/p10k.astrodark.zsh
    ~/fzf.config.zsh: zsh/fzf.config.zsh
    ~/.config/shell/fzf.astrodark.zsh: zsh/fzf.astrodark.zsh
    ~/.config/fsh/astrodark.ini: zsh/fsh.astrodark.ini
    # oh-my-zsh
    ~/.oh-my-zsh: submodules/oh-my-zsh
    ## oh-my-zsh themes
    ~/.oh-my-zsh/custom/themes/powerlevel10k: submodules/powerlevel10k
    ## oh-my-zsh custom plugins
    ~/.oh-my-zsh/custom/plugins/zsh-completions: submodules/zsh-completions
    ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions: submodules/zsh-autosuggestions
    ~/.oh-my-zsh/custom/plugins/fast-syntax-highlighting: submodules/fast-syntax-highlighting
    ~/.oh-my-zsh/custom/plugins/fzf-tab: submodules/fzf-tab
    ~/.oh-my-zsh/custom/plugins/forgit: submodules/forgit

    # tools
    ~/.fzf: submodules/fzf
    ~/.config/bat: bat
    ~/.config/delta/astrodark.gitconfig: git/delta.astrodark.gitconfig
    ~/.config/mise/config.toml: mise/config.toml
    ~/.tmux.conf: tmux/tmux.conf
    ~/.config/lazygit/config.yml: lazygit/config.yml
    ~/.config/lazygit/themes: lazygit/themes
    ~/.config/gh/config.yml: gh/config.yml
    ~/.config/gh/hosts.yml: gh/hosts.yml
    ~/.gitconfig: git/gitconfig
    ~/.gitconfig_global: git/gitconfig_global
    ~/.gitconfig_personal: git/gitconfig_personal
    ~/.gitconfig_work: git/gitconfig_work
    ~/.config/git/ignore: git/gitignore

    # ssh
    ~/.ssh/config: ssh/config
    ~/.ssh/personal: ssh/personal
    ~/.ssh/work: ssh/work

    # macos apps
    ~/Library/Preferences/com.knollsoft.Rectangle.plist: macos/Rectangle.plist
    ~/Library/Application Support/Alfred/Alfred.alfredpreferences: macos/Alfred.alfredpreferences

    # nvim
    ## my config
    ~/.config/nvim-dagadbm: neovim/dagadbm
    ## distros
    ~/.config/nvim-lazyvim: neovim/lazyvim
    ~/.config/nvim-astrovim: neovim/astrovim

    # terminals
    ~/.config/wezterm: wezterm
    ~/.config/ghostty: ghostty

    # vscode
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json
    ~/Library/Application Support/Cursor/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Cursor/User/keybindings.json: vscode/keybindings.json

    # helix
    ~/.config/helix/config.toml: helix/config.toml
    ~/.config/helix/themes: helix/themes

    # herdr
    ~/.config/herdr/config.toml: herdr/config.toml

    # ai tools
    ~/.claude/settings.json: ai/claude/settings.json
    ## scripts
    ~/.agents/scripts/bash-validator-hook.py: ai/scripts/bash-validator-hook.py
    ~/.agents/scripts/notify-hook.sh: ai/scripts/notify-hook.sh
