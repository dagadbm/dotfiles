[tasks.neovim-providers]
description = "Install neovim providers"
run = [
  "pip install --upgrade neovim-remote",
  "pip install --upgrade pynvim",
  "pip install --upgrade debugpy",
  "pnpm add -g neovim@latest",
]

[tools]
golang = "latest"
node = "lts"
pnpm = "latest"
rust = "latest"
python = "latest"
uv = "latest"
# needed for scripts/claude-update.sh
"npm:@caveman-ai/cli" = "latest"
# needed for lazyvim
lua = "5.1"

[settings]
experimental = true
activate_aggressive = true
# https://mise.jdx.dev/lang/python.html#mise-uv
python.uv_venv_create_args = ["--seed"]
# use pnpm instead of npm (except caveman, see scripts/claude-update.sh)
npm.package_manager = "pnpm"
